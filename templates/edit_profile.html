{% extends "base.html" %}

{% block title %}Edit Profile • Histogram{% endblock %}

{% block content %}
<div style="width:100%;max-width:620px;margin:0 auto;">
  
  <div style="background-color:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md);">
    
    <div style="padding:20px 28px;border-bottom:1px solid var(--border-subtle);">
      <h2 style="font-size:1.25rem;font-weight:700;">Edit Profile</h2>
    </div>

    <form method="POST" action="{{ url_for('edit_profile') }}" enctype="multipart/form-data" style="padding:28px;">
      
      <!-- Change Photo Header -->
      <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px;background:var(--bg-card);padding:16px;border-radius:var(--radius-md);">
        <img id="avatar-preview" src="{{ url_for('serve_upload', folder='profiles', filename=user.profile_picture) }}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;" alt="">
        <div>
          <div style="font-weight:700;font-size:1rem;">{{ user.username }}</div>
          <label for="profile_picture" style="color:var(--accent-cyan);font-weight:600;font-size:0.88rem;cursor:pointer;">Change photo</label>
          <input type="file" id="profile_picture" name="profile_picture" accept="image/*" style="display:none;" onchange="previewAvatar(event)">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="full_name">Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ user.full_name or '' }}" class="input-field" placeholder="Your name">
      </div>

      <div class="form-group">
        <label class="form-label" for="bio">Bio</label>
        <textarea id="bio" name="bio" class="textarea-field" placeholder="Write a short bio about yourself..." maxlength="300">{{ user.bio or '' }}</textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" required class="input-field">
      </div>

      <div style="display:flex;gap:12px;margin-top:24px;">
        <button type="submit" class="btn btn-primary" style="padding:10px 24px;">Save Changes</button>
        <a href="{{ url_for('profile', username=user.username) }}" class="btn btn-secondary" style="padding:10px 20px;">Cancel</a>
      </div>

    </form>

  </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
  function previewAvatar(event) {
    const file = event.target.files[0];
    if (file) {
      const img = document.getElementById('avatar-preview');
      img.src = URL.createObjectURL(file);
    }
  }
</script>
{% endblock %}
