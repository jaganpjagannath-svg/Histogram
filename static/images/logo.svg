<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="histogram-logo-svg">
  <defs>
    <linearGradient id="histGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="apertureRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Body -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="#090d16" stroke="url(#histGrad)" stroke-width="4.5" filter="url(#glow)"/>
  
  <!-- Subtle Internal Camera Rim -->
  <circle cx="50" cy="50" r="34" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" fill="#0f172a"/>
  
  <!-- Flash Dot -->
  <circle cx="73" cy="25" r="4.5" fill="url(#histGrad)" />

  <!-- Histogram Spectral Frequency Bars in Center Lens -->
  <!-- Bar 1 -->
  <rect x="28" y="52" width="6" height="14" rx="3" fill="#06b6d4" />
  <!-- Bar 2 -->
  <rect x="37" y="42" width="6" height="24" rx="3" fill="#38bdf8" />
  <!-- Bar 3 -->
  <rect x="46" y="32" width="6" height="34" rx="3" fill="#818cf8" />
  <!-- Bar 4 -->
  <rect x="55" y="40" width="6" height="26" rx="3" fill="#c084fc" />
  <!-- Bar 5 -->
  <rect x="64" y="48" width="6" height="18" rx="3" fill="#ec4899" />
</svg>
